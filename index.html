<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEST1N 战记 | 目标80kg</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --low: #e67e22; --mid: #3498db; --high: #9b59b6; --green: #27ae60; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .target-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .target-item { text-align: center; padding: 10px; border-radius: 8px; color: white; font-weight: bold; }
        .meal-guide { font-size: 0.85rem; line-height: 1.6; color: #444; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--green); color: white; font-weight: bold; border: none; }
    </style>
</head>
<body>

<div style="max-width: 500px; margin: auto;">
    <h2 style="text-align: center;">🚀 YEST1N 60天变身计划</h2>

    <div class="card">
        <label>选择今日模式：</label>
        <select id="mode" onchange="updateTargets()">
            <option value="low">低碳日 (保肌燃脂)</option>
            <option value="mid">中碳日 (力量维持)</option>
            <option value="high">高碳日 (重腿充糖)</option>
        </select>
        <div class="target-box">
            <div id="tc" class="target-item" style="background:var(--low)">碳: 80g</div>
            <div id="tp" class="target-item" style="background:var(--mid)">蛋: 240g</div>
            <div id="tf" class="target-item" style="background:var(--green)">脂: 65g</div>
        </div>
    </div>

    <div class="card">
        <h3>🍱 每餐把控 (建议)</h3>
        <div id="mealDetail" class="meal-guide">
            </div>
    </div>

    <div class="card">
        <input type="number" id="weight" step="0.1" placeholder="晨称体重 (kg)">
        <button onclick="save()">确认打卡</button>
        <canvas id="chart"></canvas>
    </div>
</div>

<script>
    const configs = {
        low: { c:80, p:240, f:65, meal: "晨: 麸皮+蛋 | 午: 200g肉+150g土豆 | 18:00: 1馒头+1蛋 | 21:00: 300g肉+菜(无主食)" },
        mid: { c:180, p:220, f:55, meal: "晨: 麸皮+蛋 | 午: 200g肉+200g土豆 | 18:00: 2馒头+2蛋 | 21:00: 200g肉+150g土豆" },
        high: { c:280, p:200, f:50, meal: "晨: 燕麦+2馒头 | 午: 200g牛+300g土豆 | 18:00: 3馒头+蛋白粉 | 21:00: 200g肉+250g土豆" }
    };

    function updateTargets() {
        const m = document.getElementById('mode').value;
        document.getElementById('tc').innerText = `碳: ${configs[m].c}g`;
        document.getElementById('tp').innerText = `蛋: ${configs[m].p}g`;
        document.getElementById('tf').innerText = `脂: ${configs[m].f}g`;
        document.getElementById('mealDetail').innerText = configs[m].meal;
    }

    function save() {
        const w = document.getElementById('weight').value;
        if(!w) return;
        const log = { date: new Date().toLocaleDateString(), weight: w, mode: document.getElementById('mode').value };
        let history = JSON.parse(localStorage.getItem('fit_yest')) || [];
        history.push(log);
        localStorage.setItem('fit_yest', JSON.stringify(history));
        alert('打卡成功，继续加油！');
        location.reload();
    }
    
    // 初始化
    updateTargets();
</script>
</body>
</html>
